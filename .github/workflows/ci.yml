name: Atelier CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet-build-test:
    name: .NET 10 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Atelier.slnx

      - name: Build solution
        run: dotnet build Atelier.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Atelier.slnx --no-build --configuration Release --verbosity normal

  python-lint-test:
    name: Python Agent Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./atelier-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest
        run: pytest
